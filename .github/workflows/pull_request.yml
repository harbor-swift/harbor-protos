name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  library:
    name: Library
    uses: swift-microservices/ci/.github/workflows/library.yml@f7b645aee1e52546bccba2ac7ff3f7381d07b0ef  # 1.8.0
    with:
      linux_host_archs: '["aarch64"]'
      linux_command: swift build -c release
      # SwiftPM can't build the baseline: its build plugin's protoc tools aren't built for it. buf's WIRE_JSON
      # check guards the contracts instead (harbor-plan, Decisions).
      api_breakage_check_enabled: false
