syntax = "proto3";

package harbor.auth.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Account {
  string id = 1;
  string email = 2;
  AccountStatus status = 3;
  google.protobuf.Timestamp creation_date = 4;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_PENDING_VERIFICATION = 1;
  ACCOUNT_STATUS_ACTIVE = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string idempotency_key = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

// An access token for the API and the refresh token that renews it.
message Session {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expiration_date = 2;
  string refresh_token = 3;
}

// Accounts and sessions for people, through the gateway.
service AuthService {
  // Anyone: each request carries its own proof — a password, an emailed token, a refresh token.
  rpc Register(RegisterRequest) returns (Account);
  rpc VerifyEmail(VerifyEmailRequest) returns (google.protobuf.Empty);
  rpc SignIn(SignInRequest) returns (Session);
  rpc RefreshSession(RefreshSessionRequest) returns (Session);
}
